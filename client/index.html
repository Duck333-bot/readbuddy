<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>ReadBuddy</title>
    <meta
      name="description"
      content="ReadBuddy — upload any book PDF and read it with an AI reading buddy that explains every sentence you don't understand." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..600;1,8..60,400..600&display=swap"
      rel="stylesheet" />
  </head>

  <body>
    <div id="root">
      <div class="rb-boot" role="status" aria-live="polite">
        <span class="rb-boot-mark" aria-hidden="true">↗</span>
        <span>ReadBuddy</span>
      </div>
    </div>
    <style>
      .rb-boot {
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 0.6rem;
        background: #fbf8f0;
        color: #0e1838;
        font: 600 1rem Inter, system-ui, sans-serif;
        letter-spacing: -0.02em;
        text-align: center;
      }
      .rb-boot-mark {
        color: #8377e8;
        font: italic 1.5rem Georgia, serif;
        animation: rb-boot-pulse 1.2s ease-in-out infinite alternate;
      }
      @keyframes rb-boot-pulse { to { opacity: 0.42; transform: translateY(-2px); } }
      @media (prefers-reduced-motion: reduce) { .rb-boot-mark { animation: none; } }
    </style>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
